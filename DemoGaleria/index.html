<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo</title>
    <!-- Estilos de Bootstrap para que la página se vea ordenada y bonita -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nuestros estilos personalizados -->
    <link rel="stylesheet" href="styles.css">
    <!-- Nuestro archivo de JavaScript (defer hace que cargue al final) -->
    <script src="scripts.js" defer></script>
</head>

<body>

    <!-- SECCIÓN DEL FORMULARIO: Aquí el usuario escribe o elige los datos de la clase -->
    <section class="container my-4">
        <div class="row g-4 mb-3">
            
            <!-- Campo para el nombre de la clase -->
            <div class="col-md-6">
                <div class="franja-titulo">
                    <label class="form-label">Clase</label>
                </div>
                <input type="text" id="nombre" class="form-control" placeholder="Ej: Guerrero">
            </div>
    
            <!-- Campo para la descripción corta -->
            <div class="col-md-6">
                <div class="franja-titulo">
                    <label class="form-label">Descripción</label>
                </div>
                <input type="text" id="descripcion" class="form-control" placeholder="Ej: Maestro del combate físico...">
            </div>

            <!-- Campo grande para la descripción detallada -->
            <div class="col-12">
                <div class="franja-titulo">
                    <label for="descripcionExtendida" class="form-label">Descripción Extendida</label>
                </div>
                <textarea class="form-control" id="descripcionExtendida" rows="3" placeholder="Detalles avanzados de la clase..."></textarea>
            </div>

            <!-- Menú desplegable para la Fuente de Poder (se llena automáticamente con JS) -->
            <div class="col-md-6">
                <div class="franja-titulo">
                    <label class="form-label">Fuente de Poder</label>
                </div>
                <select id="fuentePoderId" class="form-select">
                    <option value="">Selecciona una fuente...</option>
                </select>
            </div>

            <!-- Menú desplegable para elegir la imagen (se llena automáticamente con JS) -->
            <div class="col-md-6">
                <div class="franja-titulo">
                    <label class="form-label">Seleccionar Imagen</label>
                </div>
                <select id="imagenUrl" class="form-select">
                    <option value="">Selecciona una ilustración...</option>
                </select>
            </div>

            <!-- Miniatura para ver la imagen que acabas de elegir en el menú de arriba -->
            <div class="text-center mt-2" style="max-width: 150px;">
                <img id="vistaPreviaImg" 
                    src="assets/img/default.jpg" 
                    alt="Vista previa" 
                    class="img-thumbnail bg-dark border-secondary" 
                    style="height: 100px; object-fit: cover; width: 100%; display: none;">
            </div>

        </div>
    
        <!-- BOTONES DE ACCIÓN: Cada uno llama a una función diferente en nuestro JS -->
        <div class="mb-4">
            <button class="btn btn-primary" onclick="datosClases()">Listar</button>
            <button class="btn btn-success" onclick="insertarClase()">Insertar</button>
            <button class="btn btn-warning" onclick="actualizarClase()">Actualizar</button>
            <button class="btn btn-danger" onclick="borrarClase()">Borrar</button>
            <button class="btn btn-secondary" onclick="limpiarFormulario()">Limpiar</button>
        </div>

    </section>


    <!-- CONTENEDOR DE TARJETAS: Aquí el JS meterá las tarjetas de las clases automáticamente -->
    <main class="container mb-5">
        <div id="contenedorTarjetas" class="row row-cols-1 row-cols-md-3 g-4"></div>
    </main>


    <!-- VENTANA MODAL (EMERGENTE): Se abre al hacer clic en una tarjeta para ver más detalles -->
    <div class="modal fade" id="modalClase" tabindex="-1" aria-labelledby="modalClaseLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                
                <!-- Cabecera de la ventana con el título y la "X" para cerrar -->
                <div class="modal-header">
                    <h5 class="modal-title text-primary" id="modalNombre">Nombre de la Clase</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <!-- Contenido de la ventana: muestra la fuente, el resumen y el texto largo -->
                <div class="modal-body">
                    <span class="badge bg-secondary mb-3" id="modalFuente">Fuente de Poder</span>
                    <h6>Resumen:</h6>
                    <p id="modalDescripcion" class="text-muted mb-3"></p>
                    <h6>Información Detallada:</h6>
                    <p id="modalDescripcionExtendida" class="text-dark bg-light p-3 rounded border border-light-subtle" style="white-space: pre-line;"></p>
                </div>
                
                <!-- Parte inferior de la ventana con el botón de cerrar -->
                <div class="modal-footer">
                    <button type="button" class="btn class-btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Funciones de Bootstrap necesarias para que los modales y animaciones funcionen correctamente -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
