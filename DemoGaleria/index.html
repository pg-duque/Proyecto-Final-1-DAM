<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>

    <header>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Clase</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ej: Guerrero">
            </div>
    
            <div class="col-md-6">
                <label class="form-label">Descripción</label>
                <input type="text" id="descripcion" class="form-control" placeholder="Ej:Maestro del combate físico, el guerrero destaca por su resistencia, " +
                        "disciplina y dominio de armas y armaduras en cualquier batalla.">
            </div>

            <div class="col-md-4">
                <label class="form-label">Fuente de Poder</label>
                <select id="fuentePoderId" class="form-select">
                    <option value="">Selecciona una fuente...</option>
                </select>
            </div>
        </div>
    
            <div class="mb-3">
            <button class="btn btn-primary" onclick="datosClases()">Listar</button>
            <button class="btn btn-success" onclick="insertarClase()">Insertar</button>
            <button class="btn btn-warning" onclick="actualizarClase()">Actualizar</button>
            <button class="btn btn-danger" onclick="borrarClase()">Borrar</button>
        </div>
    </header>

    <main class="container">
        <div id="contenedorTarjetas" class="row row-cols-1 row-cols-md-3 g-4"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    
</body>
</html>
